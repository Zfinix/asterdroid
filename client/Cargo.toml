[package]
name = "asterctl"
version = "0.1.0"
edition = "2021"

# Its own workspace: the probe is not part of the Rust build.
[workspace]

[dependencies]
libc = "0.2"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "process", "io-util", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# The relay link is the only outbound TLS. ring is the one provider enabled, so
# rustls picks it without being told, and the roots are compiled in because a
# phone's trust store is not reachable from a plain binary.
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = { version = "0.2", features = ["std"] }

[[bin]]
name = "asterctl"
path = "src/main.rs"

[profile.release]
opt-level = "z"
strip = true
